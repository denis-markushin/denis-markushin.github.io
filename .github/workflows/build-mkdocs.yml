name: build-mkdocs
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-mkdocs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with history for feed dates
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Key the cache by week
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - name: Cache plugin data
        uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Install MkDocs
        run: pip install -r requirements.txt
      - name: Build the site
        run: mkdocs build
      - name: Check the built site
        run: python -m unittest discover --start-directory tests
        timeout-minutes: 5
        env:
          SITE: site
      - name: Upload the site for Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site to Pages
        id: deployment
        uses: actions/deploy-pages@v5
