{% extends "base.html" %}

{% block site_meta %}
  {% if page.meta and page.meta.description %}
    {{
      super() | replace(
        'content="' ~ page.meta.description ~ '"',
        'content="' ~ (page.meta.description | e) ~ '"'
      )
    }}
  {% else %}
    {{ super() }}
  {% endif %}
{% endblock %}

  <meta name="yandex-verification" content="4905a2f9a8f37b27"/>
{% endblock %}
